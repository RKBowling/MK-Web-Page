    <h1>Add New Kharacter</h1>
    <main class="flex-grow-1">
      <div class="container-1g py-5">
        <div class="page-header text-center mb-5 pb-4 border-bottom">
           
        </div>
        <form id="newCharacterForm" action="submit-character.php" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Kharacter Name:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="realm" class="form-label">Realm:</label>
                <input type="text" class="form-control" id="realm" name="realm" required>
            </div>
            <div class="mb-3">
                <label for="rivalry" class="form-label">Rivalry:</label>
                <input type="text" class="form-control" id="rivalry" name="rivalry" required>
            </div>
            <div class="mb-3">
                <label for="bio" class="form-label">Bio:</label>
                <textarea class="form-control" id="bio" name="bio" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="imageUrl" class="form-label">Image URL:</label>
                <input type="url" class="form-control" id="imageUrl" name="imageUrl" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </main>
